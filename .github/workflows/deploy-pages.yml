name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_APP_SITE_URL: https://johnrayon158-boop.github.io/Skillbridge-malawi1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment configuration
        shell: bash
        run: |
          : "${VITE_SUPABASE_URL:?Set the VITE_SUPABASE_URL Actions variable.}"
          : "${VITE_SUPABASE_PUBLISHABLE_KEY:?Set the VITE_SUPABASE_PUBLISHABLE_KEY Actions variable.}"
          : "${VITE_API_BASE_URL:?Set VITE_API_BASE_URL to the deployed backend URL.}"
          case "$VITE_API_BASE_URL" in
            https://*) ;;
            *) echo "VITE_API_BASE_URL must use HTTPS."; exit 1 ;;
          esac

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Add client-side route fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
